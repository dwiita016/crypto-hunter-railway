<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Hunter // Railway</title>
<style>
  :root{color-scheme:dark;--bg:#050b0f;--panel:#09141b;--line:#1b3441;--txt:#e8f7ff;--muted:#7394a7;--green:#2df3aa;--purple:#ad7cff;--red:#ff5b72;--yellow:#ffd166}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:12px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;background:#050b0fee;backdrop-filter:blur(8px);z-index:3}
  h1{margin:0;font-size:22px} h1 b{color:var(--green)}
  button,input{background:#08151c;color:var(--txt);border:1px solid #244451;border-radius:8px;padding:9px 11px}
  button{cursor:pointer} button.primary{border-color:#197452;color:var(--green)}
  main{padding:12px}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar input{flex:1}
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.card small{color:var(--muted)}.card strong{display:block;font-size:18px;margin-top:3px}
  .tableWrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:72vh}table{border-collapse:collapse;width:100%;min-width:1600px}th,td{border-bottom:1px solid #17303a;padding:8px 9px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#08131a;color:#7ca2b8;font-size:10px}
  .buy,.strong{color:var(--green)}.early{color:var(--purple)}.skip{color:var(--red)}.wait{color:#92a9b6}.bad{color:var(--red)}.ok{color:var(--green)}.muted{color:var(--muted)}
  .reason{max-width:380px;overflow:hidden;text-overflow:ellipsis}.addr{font-size:9px;color:#4e7285}
.footer{padding:14px 16px;text-align:center;color:var(--muted);border-top:1px solid var(--line);margin-top:12px;font-size:11px}.footer b{color:var(--green)}
</style>
</head>
<body>
<header>
  <div><h1>CRYPTO <b>HUNTER</b> // RAILWAY</h1><div class="muted">Live pair validation → scoring → decision</div></div>
  <div><button onclick="load()">↻ Refresh</button> <button class="primary" onclick="scanAll()">▶ Run Active Scan</button></div>
</header>
<main>
  <div class="toolbar">
    <input id="addr" placeholder="Solana token address...">
    <button class="primary" onclick="addToken()">+ Add & Scan</button>
  </div>
  <div class="cards" id="cards"></div>
  <div class="tableWrap">
    <table>
      <thead><tr>
        <th>TOKEN</th><th>PAIR LP</th><th>TOTAL LP</th><th>LIVE/ALL</th><th>SCORE</th>
        <th>RISK</th><th>ENTRY</th><th>MC</th><th>VOL24H</th>
        <th>CNT 5M</th><th>CNT 1H</th><th>CNT 6H</th><th>CNT 24H</th>
        <th>5M %</th><th>1H %</th><th>24H %</th>
        <th>SIGNAL</th><th>REASON</th><th>SCANNED</th><th>DELETE</th>
      </tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const money=n=>n==null?"—":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",notation:"compact",maximumFractionDigits:1}).format(n);
const num=(n,d=2)=>n==null?"—":Number(n).toFixed(d);
const pct=n=>n==null?"—":`${Number(n).toFixed(1)}%`;
const cls=d=>d==="BUY"?"buy":d==="STRONG_WATCH"?"strong":d==="EARLY_WATCH"?"early":d==="SKIP"?"skip":"wait";

async function api(url,opt){
  const r=await fetch(url,opt);
  const j=await r.json();
  if(!r.ok||j.ok===false) throw new Error(j.error||r.statusText);
  return j;
}

async function load(){
  const j=await api("/api/results");
  const a=j.results||[];
  const c={BUY:0,STRONG_WATCH:0,EARLY_WATCH:0,WAIT:0,SKIP:0};
  a.forEach(x=>c[x.decision]=(c[x.decision]||0)+1);
  $("#cards").innerHTML=[
    ["TOKENS",a.length],["BUY",c.BUY],["STRONG WATCH",c.STRONG_WATCH],
    ["EARLY WATCH",c.EARLY_WATCH],["WAIT",c.WAIT],["SKIP",c.SKIP]
  ].map(([k,v])=>`<div class="card"><small>${k}</small><strong>${v}</strong></div>`).join("");

  $("#body").innerHTML=a.map(x=>`
    <tr>
      <td><b>${x.symbol||"?"}</b><div class="addr">${x.address}</div></td>
      <td>${money(x.pair_lp_usd)}</td><td>${money(x.total_lp_usd)}</td>
      <td class="${x.tradable_pair_count>0?"ok":"bad"}">${x.tradable_pair_count}/${x.pair_count}</td>
      <td>${num(x.score)}</td><td>${x.risk||"—"}</td>
      <td class="${cls(x.decision)}"><b>${x.entry_state||x.decision}</b></td>
      <td>${money(x.market_cap_usd)}</td><td>${money(x.volume_24h_usd)}</td>
      <td>${num(x.buy_ratio_5m)}</td><td>${num(x.buy_ratio_1h)}</td>
      <td>${num(x.buy_ratio_6h)}</td><td>${num(x.buy_ratio_24h)}</td>
      <td>${pct(x.price_change_5m)}</td><td>${pct(x.price_change_1h)}</td><td>${pct(x.price_change_24h)}</td>
      <td class="${cls(x.decision)}">${x.signal||"—"}</td>
      <td class="reason" title="${(x.reason||"").replaceAll('"','&quot;')}">${x.reason||"—"}</td>
      <td>${x.scanned_at?new Date(x.scanned_at).toLocaleTimeString():"—"}</td>
      <td><button onclick="del('${x.address}')">DELETE</button></td>
    </tr>`).join("");
}

async function addToken(){
  const address=$("#addr").value.trim(); if(!address)return;
  const b=document.activeElement; if(b)b.disabled=true;
  try{
    await api("/api/tokens",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({address,chain:"solana"})});
    $("#addr").value=""; await load();
  }catch(e){alert(e.message)}finally{if(b)b.disabled=false}
}

async function scanAll(){
  const b=event.currentTarget;b.disabled=true;b.textContent="Scanning...";
  try{await api("/api/scan-all",{method:"POST"});await load()}
  catch(e){alert(e.message)}
  finally{b.disabled=false;b.textContent="▶ Run Active Scan"}
}

async function del(address){
  if(!confirm("Disable token from active scan?"))return;
  await api(`/api/tokens/${encodeURIComponent(address)}`,{method:"DELETE"});
  await load();
}
load();
setInterval(load,30000);
</script>
<footer class="footer">Built for <b>@dwiita2026</b></footer>
</body>
</html>
